<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>YUAN OKLink 批次反查</title><style>body{font:14px Arial,'Microsoft JhengHei',sans-serif;width:420px;margin:0;padding:14px;color:#172033}h3{margin:0 0 8px}button{padding:8px 10px;margin:4px 4px 4px 0;border:0;border-radius:6px;background:#1769aa;color:#fff;cursor:pointer}button.secondary{background:#4b5563}#status{margin:10px 0;line-height:1.5}#results{max-height:260px;overflow:auto;font-size:12px}.r{padding:6px 0;border-top:1px solid #ddd}</style></head><body><h3>🔎 YUAN OKLink 批次反查</h3><div>CSV 是唯一地址來源；直接讀 OKLink「代幣轉賬」頁面的 Tag。</div><input id="file" type="file" accept=".csv,text/csv"><div><button id="import">匯入 CSV</button><button id="start">開始批次</button><button id="stop" class="secondary">停止</button><button id="export" class="secondary">下載結果</button></div><div id="status">尚未匯入 CSV</div><div id="results"></div><script src="popup.js"></script></body></html>
