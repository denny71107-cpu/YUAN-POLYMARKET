<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 台灣地方選舉 Polymarket 全台查詢工具</title><style>
:root{--bg:#f3f6f9;--text:#172033;--muted:#657287;--blue:#155e9a;--line:#d8e0e8;--green:#07883b;--red:#dc2638}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,"Microsoft JhengHei",sans-serif}.wrap{max-width:1240px;margin:28px auto;padding:0 16px 50px}.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #0000000d}h1{margin:0 0 7px;font-size:27px}h2{margin:0 0 14px;font-size:19px}.sub,.note,.progress{color:var(--muted);font-size:13px}.badge{display:inline-block;background:#e8f1f8;color:#155e9a;border-radius:999px;padding:3px 9px;font-size:12px;margin-right:4px}.grid{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1.3fr;gap:12px}label{display:block;font-weight:700;margin-bottom:6px}select,input,button{width:100%;border:1px solid #cfd8e3;border-radius:8px;padding:10px 11px;font-size:14px;background:#fff}button{border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}.secondary{background:#4b5563}.hidden{display:none!important}.advanced{margin-top:12px;border-top:1px solid #edf0f4;padding-top:10px}.advanced summary{cursor:pointer;color:#8a94a3;font-size:12px}.advanced-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ghost{background:#f1f3f6;color:#596475;font-size:12px}.track-grid{display:grid;grid-template-columns:220px 1fr auto;gap:10px}.track-grid button{width:auto;min-width:170px}.progress{margin-top:9px}.trade-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.trade-filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin:8px 0 12px}.tradewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:650px}.trade{width:100%;min-width:1080px;border-collapse:collapse;font-size:13px}.trade th,.trade td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}.trade th{position:sticky;top:0;background:#edf2f7;z-index:2}.trade tbody tr:hover{background:#f7fbff}.num{text-align:right!important}.time{font-family:Consolas,monospace;color:#475569}.candidate{display:inline-block;background:#2f7fb9;color:#fff;border-radius:4px;padding:3px 7px;font-weight:800;font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis}.side{display:inline-block;color:#fff;border-radius:4px;padding:3px 7px;font-weight:800;font-size:11px}.buy{background:var(--green)}.sell{background:var(--red)}.other{background:#64748b}.linkish,.mono{color:#0563d8;text-decoration:none}.mono{font-family:Consolas,monospace}.copy{width:auto;background:transparent;color:#a6afba;padding:0 2px}.loading{color:#155e9a;font-size:12px;margin-top:6px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.advanced-box,.trade-filters{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.track-grid{grid-template-columns:1fr 1fr}.track-grid button{grid-column:1/-1;width:100%}}@media(max-width:560px){.grid,.track-grid{grid-template-columns:1fr}.trade-head{display:block}.track-grid button{width:100%}}
</style></head><body><div class="wrap">
<div class="card"><h1>2026 台灣地方選舉 Polymarket 全台查詢工具</h1><p class="sub">22 縣市 + 全國政黨市場｜單一市場成交、帳號與錢包 Activity 追查。</p><span class="badge">台灣時間 UTC+8</span><span class="badge">市場範圍追查</span><span class="badge">Activity</span><span class="badge">CSV 匯出</span></div>
<div class="card"><h2>查詢條件</h2><div class="grid"><div><label>地區／市場</label><select id="eventSelect"></select><div id="marketLoading" class="loading"></div></div><div><label>候選人／政黨</label><select id="marketSelect"><option value="all">讀取中…</option></select></div><div><label>日期範圍</label><select id="dateMode" onchange="toggleDates()"><option value="all">全部紀錄</option><option value="today">今天</option><option value="custom">自訂日期</option></select></div><div id="dateCustomWrap" class="hidden"><label>自訂日期</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input type="date" id="startDate"><input type="date" id="endDate"></div></div></div><div class="actions"><button onclick="fetchTrades()">抓取成交紀錄</button><button class="secondary" onclick="downloadCSV()">下載 CSV</button></div><details class="advanced"><summary>進階工具 ▾</summary><div class="advanced-box"><button class="ghost" onclick="openEventPage()">開啟 Polymarket 頁面</button><button class="ghost" onclick="openGamma()">開啟 Event JSON</button><button class="ghost" onclick="openRawTrades()">開啟原始 trades</button></div></details></div>
<div class="card"><h2>帳號／錢包追查</h2><p class="sub">先選追查範圍。程式只向 Polymarket Activity API 查詢該範圍的市場，不再把帳號數千筆歷史 Activity 全部下載。</p><div class="track-grid"><select id="globalScope"><option value="all">全部縣市</option></select><input id="globalQuery" placeholder="輸入 Polymarket 名稱、暱稱或 0x Proxy Wallet"><button id="trackBtn" onclick="globalSearch()">開始追查</button></div><div id="globalProgress" class="progress">尚未搜尋。</div></div>
<div class="card"><div class="trade-head"><h2>成交／活動紀錄預覽</h2><div id="summary" class="note">尚未抓取。</div></div><div class="trade-filters"><div><label>篩選候選人／政黨</label><select id="tradeCandidateFilter" onchange="renderTrades()"><option value="all">全部</option></select></div><div><label>篩選類型</label><select id="tradeSideFilter" onchange="renderTrades()"><option value="all">全部</option><option>BUY</option><option>SELL</option><option>MERGE</option><option>SPLIT</option><option>REDEEM</option></select></div><div><label>篩選標的</label><select id="tradeOutcomeFilter" onchange="renderTrades()"><option value="all">全部</option><option>Yes</option><option>No</option></select></div></div><div class="tradewrap"><table class="trade"><thead><tr><th>時間 (UTC+8) ↓</th><th>地區</th><th>候選人／政黨</th><th>類型</th><th>標的</th><th class="num">Shares</th><th class="num">價格</th><th class="num">總金額</th><th>名稱</th><th>錢包</th><th>Hash</th></tr></thead><tbody id="tradeTable"><tr><td colspan="11">尚未抓取</td></tr></tbody></table></div></div></div>
<script>
const EVENTS=[["基隆市","keelung-mayor-election-winner-20260813135716100"],["台北市","taipei-mayor-election-winner-20260813125857100"],["新北市","new-taipei-mayor-election-winner-20260813125857200"],["桃園市","taoyuan-mayor-election-winner-20260813125857300"],["新竹市","hsinchu-city-mayor-election-winner-20260813135716400"],["新竹縣","hsinchu-county-magistrate-election-winner-20260813135716300"],["苗栗縣","miaoli-county-magistrate-election-winner-20260813135716500"],["台中市","taichung-mayor-election-winner-20260813125857400"],["彰化縣","changhua-county-magistrate-election-winner-20260813135716600"],["南投縣","nantou-county-magistrate-election-winner-20260813135716700"],["雲林縣","yunlin-county-magistrate-election-winner-20260813135716800"],["嘉義市","chiayi-city-mayor-election-winner-202608131357161000"],["嘉義縣","chiayi-county-magistrate-election-winner-20260813135716900"],["台南市","tainan-mayor-election-winner-20260813125857500"],["高雄市","kaohsiung-mayor-election-winner-20260813125857600"],["屏東縣","pingtung-county-magistrate-election-winner-202608131357161100"],["宜蘭縣","yilan-county-magistrate-election-winner-20260813135716200"],["花蓮縣","hualien-county-magistrate-election-winner-202608131357161200"],["台東縣","taitung-county-magistrate-election-winner-202608131357161300"],["澎湖縣","penghu-county-magistrate-election-winner-202608131357161400"],["金門縣","kinmen-county-magistrate-election-winner-202608131357161500"],["連江縣","lienchiang-county-magistrate-election-winner-202608131357161600"],["全國－政黨勝出","2026-taiwanese-local-elections-party-winner"]];let currentMarkets=[],currentRows=[],marketMap=new Map();
const gammaUrl=s=>`https://gamma-api.polymarket.com/events/slug/${s}`,eventUrl=s=>`https://polymarket.com/zh-hant/event/${s}`,tradesUrl=(c,o=0)=>`https://data-api.polymarket.com/trades?market=${c}&limit=10000&offset=${o}`,profileSearchUrl=q=>`https://gamma-api.polymarket.com/public-search?q=${encodeURIComponent(q)}&search_profiles=true&limit_per_type=20`,profileUrl=w=>`https://polymarket.com/zh-hant/profile/${w}`,oklinkTxUrl=h=>`https://www.oklink.com/polygon/tx/${encodeURIComponent(h)}`;
function activityUrl(w,market,o=0){return `https://data-api.polymarket.com/activity?user=${encodeURIComponent(w)}&market=${encodeURIComponent(market)}&limit=500&offset=${o}&sortDirection=DESC`}
async function j(url){let last;const routes=[url+(url.includes('?')?'&':'?')+'_='+Date.now(),`https://corsproxy.io/?url=${encodeURIComponent(url)}`,`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];for(const u of routes){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}catch(e){last=e}}throw last}
function displayName(m){return m.groupItemTitle||m.question||m.slug||m.conditionId}function toggleDates(){dateCustomWrap.classList.toggle('hidden',dateMode.value!=='custom')}
async function loadMarkets(){marketSelect.disabled=true;marketLoading.textContent='正在讀取候選人…';try{const ev=await j(gammaUrl(eventSelect.value));currentMarkets=(ev.markets||[]).filter(m=>m.active===true||Number(m.volume||0)>0);if(!currentMarkets.length)currentMarkets=ev.markets||[];marketSelect.innerHTML='<option value="all">全部</option>'+currentMarkets.map((m,i)=>`<option value="${i}">${safe(displayName(m))}</option>`).join('');marketLoading.textContent=`已讀取 ${currentMarkets.length} 個市場`}catch(e){marketLoading.textContent='讀取失敗';marketSelect.innerHTML='<option value="all">讀取失敗</option>'}marketSelect.disabled=false}
function twTime(ts){const d=new Date(Number(ts)*1000),p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}:${o.second}`}function todayTW(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function keepDate(r){const d=r['台灣時間'].slice(0,10);if(dateMode.value==='all')return true;if(dateMode.value==='today')return d===todayTW();return !(startDate.value&&d<startDate.value)&&!(endDate.value&&d>endDate.value)}
function rowFrom(x,region,name,type){const size=Number(x.size||0),price=Number(x.price||0),money=Number(x.usdcSize??x.usdc_size??size*price);return {'台灣時間':twTime(x.timestamp),'地區':region||'','候選人／政黨':name||x.title||'','買賣':type||x.type||x.side||'','結果':x.outcome||'','Shares':size,'成交價格':price,'成交金額_USDC':money,'帳號名稱':x.name||'','暱稱':x.pseudonym||'','Proxy Wallet':x.proxyWallet||x.proxy_wallet||'','Transaction Hash':x.transactionHash||x.transaction_hash||'','Condition ID':x.conditionId||x.condition_id||'','Asset':x.asset||'','市場標題':x.title||'','Event Slug':x.eventSlug||x.event_slug||''}}
async function fetchOne(region,m){const a=await j(tradesUrl(m.conditionId));return Array.isArray(a)?a.map(x=>rowFrom(x,region,displayName(m),x.side||'TRADE')):[]}
function dedupeRows(rows){const s=new Set();return rows.filter(r=>{const k=[r['台灣時間'],r['Transaction Hash'],r.Asset,r['Condition ID'],r['買賣'],r['結果'],r.Shares,r['成交價格'],r['Proxy Wallet']].join('|');if(s.has(k))return false;s.add(k);return true})}
function scopedEvents(){return globalScope.value==='all'?EVENTS:EVENTS.filter((_,i)=>String(i)===globalScope.value)}
async function buildMarketMap(events){marketMap=new Map();const ids=[];for(let i=0;i<events.length;i++){const [region,slug]=events[i];globalProgress.textContent=`讀取追查範圍 ${i+1}/${events.length}：${region}`;const ev=await j(gammaUrl(slug));for(const m of (ev.markets||[])){const id=String(m.conditionId||'').toLowerCase();if(id){marketMap.set(id,{region,name:displayName(m),slug});ids.push(id)}}}return [...new Set(ids)]}
async function resolveWallet(q,events){if(/^0x[a-f0-9]{40}$/i.test(q))return {wallet:q,label:q};globalProgress.textContent='正在定位 Polymarket 帳號…';try{const r=await j(profileSearchUrl(q)),p=Array.isArray(r?.profiles)?r.profiles:[],exact=p.find(x=>[x.name,x.pseudonym].some(v=>String(v||'').trim().toLowerCase()===q));if(exact?.proxyWallet)return {wallet:exact.proxyWallet,label:exact.name||exact.pseudonym||q};if(p.length===1&&p[0]?.proxyWallet)return {wallet:p[0].proxyWallet,label:p[0].name||p[0].pseudonym||q}}catch(e){}for(const [region,slug] of events){globalProgress.textContent=`備援定位帳號：${region}`;try{const ev=await j(gammaUrl(slug));for(const m of (ev.markets||[])){const a=await j(`https://data-api.polymarket.com/trades?market=${m.conditionId}&limit=10000&offset=0`),hit=Array.isArray(a)&&a.find(x=>String(x.name||'').trim().toLowerCase()===q||String(x.pseudonym||'').trim().toLowerCase()===q);if(hit?.proxyWallet)return {wallet:hit.proxyWallet,label:hit.name||hit.pseudonym||q}}}catch(e){}}return null}
async function fetchScopedActivity(wallet,ids){let out=[],failed=0;for(let i=0;i<ids.length;i++){let offset=0;while(offset<=10000){globalProgress.textContent=`讀取指定市場 ${i+1}/${ids.length}${offset?`，第 ${offset+1}–${offset+500} 筆`:''}`;try{const a=await j(activityUrl(wallet,ids[i],offset));if(!Array.isArray(a)||!a.length)break;out.push(...a);if(a.length<500)break;offset+=500}catch(e){failed++;break}}}return {rows:out,failed}}
async function globalSearch(){const q=(globalQuery.value||'').trim().toLowerCase();if(!q)return alert('請輸入名稱、暱稱或錢包地址');trackBtn.disabled=true;trackBtn.textContent='追查中…';currentRows=[];try{const events=scopedEvents(),scopeName=globalScope.value==='all'?'全部縣市':globalScope.selectedOptions[0].textContent,ids=await buildMarketMap(events),resolved=await resolveWallet(q,events);if(!resolved){globalProgress.textContent='找不到符合的帳號／錢包。';renderTrades();return}globalProgress.textContent=`已找到錢包 ${resolved.wallet.slice(0,8)}…，查詢 ${scopeName} 的 ${ids.length} 個市場…`;const result=await fetchScopedActivity(resolved.wallet,ids),a=result.rows;for(const x of a){const id=String(x.conditionId||x.condition_id||'').toLowerCase(),m=marketMap.get(id);if(!m)continue;const type=String(x.type||'').toUpperCase()==='TRADE'?(x.side||'TRADE'):String(x.type||x.side||'').toUpperCase();currentRows.push(rowFrom({...x,proxyWallet:x.proxyWallet||resolved.wallet},m.region,m.name,type))}currentRows=dedupeRows(currentRows).sort((a,b)=>b['台灣時間'].localeCompare(a['台灣時間']));populateTradeFilters();renderTrades();globalProgress.textContent=`完成：${scopeName}｜${resolved.label}｜${currentRows.length} 筆活動${result.failed?`｜${result.failed} 個市場讀取失敗`:''}`}catch(e){globalProgress.textContent='追查失敗：'+(e?.message||e)}finally{trackBtn.disabled=false;trackBtn.textContent='開始追查'}}
async function fetchTrades(){if(!currentMarkets.length)await loadMarkets();const region=eventSelect.selectedOptions[0].textContent,targets=marketSelect.value==='all'?currentMarkets:[currentMarkets[Number(marketSelect.value)]];currentRows=[];try{for(const m of targets)currentRows.push(...await fetchOne(region,m));currentRows=dedupeRows(currentRows.filter(keepDate)).sort((a,b)=>b['台灣時間'].localeCompare(a['台灣時間']));populateTradeFilters();renderTrades()}catch(e){alert('抓取失敗：'+(e?.message||e))}}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function populateTradeFilters(){const old=tradeCandidateFilter.value,n=[...new Set(currentRows.map(r=>r['候選人／政黨']).filter(Boolean))].sort();tradeCandidateFilter.innerHTML='<option value="all">全部</option>'+n.map(x=>`<option>${safe(x)}</option>`).join('');if(n.includes(old))tradeCandidateFilter.value=old}function filteredRows(){return currentRows.filter(r=>(tradeCandidateFilter.value==='all'||r['候選人／政黨']===tradeCandidateFilter.value)&&(tradeSideFilter.value==='all'||r['買賣']===tradeSideFilter.value)&&(tradeOutcomeFilter.value==='all'||String(r['結果']).toLowerCase()===tradeOutcomeFilter.value.toLowerCase()))}function short(v){return !v?'—':v.length>15?v.slice(0,7)+'…'+v.slice(-4):v}function copy(v,b){navigator.clipboard.writeText(v).then(()=>{b.textContent='✓';setTimeout(()=>b.textContent='▣',800)})}
function renderTrades(){const rows=filteredRows();tradeTable.innerHTML='';for(const r of rows.slice(0,500)){const tr=document.createElement('tr'),w=r['Proxy Wallet'],h=r['Transaction Hash'],nm=r['帳號名稱']||r['暱稱']||'—',cls=r['買賣']==='BUY'?'buy':r['買賣']==='SELL'?'sell':'other';tr.innerHTML=`<td class="time">${safe(r['台灣時間'])}</td><td>${safe(r['地區'])}</td><td><span class="candidate">${safe(r['候選人／政黨'])}</span></td><td><span class="side ${cls}">${safe(r['買賣'])}</span></td><td>${safe(r['結果'])}</td><td class="num">${Number(r.Shares||0).toFixed(2)}</td><td class="num">${Number(r['成交價格']||0)?(Number(r['成交價格'])*100).toFixed(1)+'¢':'—'}</td><td class="num"><b>$${Number(r['成交金額_USDC']||0).toFixed(2)}</b></td><td><a class="linkish" href="${profileUrl(encodeURIComponent(w))}" target="_blank">${safe(nm)}</a></td><td><a class="mono wallet" href="#">${safe(short(w))}</a> <button class="copy">▣</button></td><td><a class="mono" href="${oklinkTxUrl(h)}" target="_blank">${safe(short(h))}</a> <button class="copy">▣</button></td>`;tr.querySelector('.wallet').onclick=e=>{e.preventDefault();navigator.clipboard.writeText(w);window.open('https://relay.link/transactions','_blank')};const b=tr.querySelectorAll('.copy');b[0].onclick=()=>copy(w,b[0]);b[1].onclick=()=>copy(h,b[1]);tradeTable.appendChild(tr)}if(!rows.length)tradeTable.innerHTML='<tr><td colspan="11">沒有符合條件的資料</td></tr>';summary.textContent=`顯示 ${rows.length} / ${currentRows.length} 筆 · 金額 ${rows.reduce((s,r)=>s+Number(r['成交金額_USDC']||0),0).toFixed(2)} USDC · 預覽最多 500 筆`}
function esc(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function downloadCSV(){const rows=filteredRows();if(!rows.length)return alert('目前沒有可下載的紀錄');const h=['台灣時間','地區','候選人／政黨','買賣','結果','Shares','成交價格','成交金額_USDC','帳號名稱','暱稱','Proxy Wallet','Transaction Hash','Condition ID','Asset','市場標題','Event Slug'],csv='\ufeff'+h.map(esc).join(',')+'\r\n'+rows.map(r=>h.map(k=>esc(r[k])).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Polymarket_活動紀錄.csv';a.click()}function openEventPage(){window.open(eventUrl(eventSelect.value),'_blank')}function openGamma(){window.open(gammaUrl(eventSelect.value),'_blank')}function openRawTrades(){const t=marketSelect.value==='all'?currentMarkets:[currentMarkets[Number(marketSelect.value)]];t.forEach(m=>window.open(tradesUrl(m.conditionId),'_blank'))}
EVENTS.forEach(([n,v],i)=>{eventSelect.add(new Option(n,v));globalScope.add(new Option(n,String(i)))});eventSelect.onchange=()=>{currentRows=[];tradeTable.innerHTML='<tr><td colspan="11">尚未抓取</td></tr>';summary.textContent='尚未抓取。';loadMarkets()};loadMarkets();
</script></body></html>
