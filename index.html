<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 台灣地方選舉 Polymarket 全台查詢工具</title>
<style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--primary:#1f4e78;--border:#d1d5db}*{box-sizing:border-box}body{font-family:Segoe UI,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);margin:0}.wrap{max-width:1180px;margin:32px auto;padding:0 18px 60px}.card{background:var(--card);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 14px;font-size:20px}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin-bottom:6px}select,input,button{width:100%;font-size:15px;padding:10px 11px;border-radius:9px;border:1px solid var(--border);background:white}button{background:var(--primary);color:white;border:0;cursor:pointer;font-weight:700}.secondary{background:#4b5563!important}.light{background:#e5e7eb!important;color:#111827!important}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}@media(max-width:700px){.actions{grid-template-columns:1fr}}.hidden{display:none!important}#log{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:14px;border-radius:10px;min-height:180px;max-height:420px;overflow:auto;font-family:Consolas,monospace;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e5e7eb;padding:9px 8px;text-align:left}th{background:#f8fafc;position:sticky;top:0}.tablewrap{max-height:420px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px}.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#e5eef6;color:#1f4e78;font-size:12px}.note{font-size:13px;color:var(--muted)}</style>
</head><body><div class="wrap">
<div class="card"><h1>2026 台灣地方選舉 Polymarket 全台查詢工具</h1><p class="sub">22 縣市 + 全國政黨市場。每次執行都會重新抓取 Polymarket 當下最新公開成交紀錄。</p><span class="badge">台灣時間 UTC+8</span> <span class="badge">自動找目前啟用候選人</span> <span class="badge">匯出 CSV</span></div>
<div class="card"><h2>查詢條件</h2><div class="grid"><div><label>地區／市場</label><select id="eventSelect"></select></div><div><label>候選人／政黨</label><select id="marketSelect"><option value="all">全部</option></select></div><div><label>日期範圍</label><select id="dateMode" onchange="toggleDates()"><option value="all">全部紀錄</option><option value="today">今天</option><option value="custom">自訂日期</option></select></div><div id="dateCustomWrap" class="hidden"><label>自訂日期</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input type="date" id="startDate"><input type="date" id="endDate"></div></div></div><div class="actions"><button onclick="loadMarkets()">① 讀取候選人</button><button onclick="fetchTrades()">② 抓取成交紀錄</button><button class="secondary" onclick="downloadCSV()">③ 下載 CSV</button></div><div class="actions"><button class="light" onclick="openEventPage()">開啟 Polymarket 頁面</button><button class="light" onclick="openGamma()">開啟 Event JSON</button><button class="light" onclick="openRawTrades()">開啟所選市場原始 trades</button></div><p class="note">如果瀏覽器因 CORS 阻擋直接抓取，可使用下方「開啟 Event JSON／原始 trades」作為備援。</p></div>
<div class="card"><h2>目前市場</h2><div class="tablewrap"><table><thead><tr><th>名稱</th><th>Active</th><th>成交量</th><th>Condition ID</th></tr></thead><tbody id="marketTable"><tr><td colspan="4">尚未讀取</td></tr></tbody></table></div></div>
<div class="card"><h2>執行狀態</h2><div id="log">尚未開始。</div></div>
<div class="card"><h2>成交紀錄預覽</h2><div id="summary" class="note">尚未抓取。</div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>台灣時間</th><th>地區</th><th>候選人／政黨</th><th>BUY/SELL</th><th>Yes/No</th><th>Shares</th><th>價格</th><th>金額</th><th>帳號</th><th>Proxy Wallet</th></tr></thead><tbody id="tradeTable"><tr><td colspan="10">尚未抓取</td></tr></tbody></table></div></div>
</div><script>
const EVENTS=[["基隆市","keelung-mayor-election-winner-20260813135716100"],["台北市","taipei-mayor-election-winner-20260813125857100"],["新北市","new-taipei-mayor-election-winner-20260813125857200"],["桃園市","taoyuan-mayor-election-winner-20260813125857300"],["新竹市","hsinchu-city-mayor-election-winner-20260813135716400"],["新竹縣","hsinchu-county-magistrate-election-winner-20260813135716300"],["苗栗縣","miaoli-county-magistrate-election-winner-20260813135716500"],["台中市","taichung-mayor-election-winner-20260813125857400"],["彰化縣","changhua-county-magistrate-election-winner-20260813135716600"],["南投縣","nantou-county-magistrate-election-winner-20260813135716700"],["雲林縣","yunlin-county-magistrate-election-winner-20260813135716800"],["嘉義市","chiayi-city-mayor-election-winner-202608131357161000"],["嘉義縣","chiayi-county-magistrate-election-winner-20260813135716900"],["台南市","tainan-mayor-election-winner-20260813125857500"],["高雄市","kaohsiung-mayor-election-winner-20260813125857600"],["屏東縣","pingtung-county-magistrate-election-winner-202608131357161100"],["宜蘭縣","yilan-county-magistrate-election-winner-20260813135716200"],["花蓮縣","hualien-county-magistrate-election-winner-202608131357161200"],["台東縣","taitung-county-magistrate-election-winner-202608131357161300"],["澎湖縣","penghu-county-magistrate-election-winner-202608131357161400"],["金門縣","kinmen-county-magistrate-election-winner-202608131357161500"],["連江縣","lienchiang-county-magistrate-election-winner-202608131357161600"],["全國－政黨勝出","2026-taiwanese-local-elections-party-winner"]];
let currentMarkets=[],currentRows=[];function init(){const s=document.getElementById('eventSelect');EVENTS.forEach(([n,sl])=>{const o=document.createElement('option');o.value=sl;o.textContent=n;s.appendChild(o)})}function log(m,r=false){const e=document.getElementById('log');if(r)e.textContent=m;else e.textContent+='\n'+m;e.scrollTop=e.scrollHeight}function toggleDates(){document.getElementById('dateCustomWrap').classList.toggle('hidden',document.getElementById('dateMode').value!=='custom')}function gammaUrl(s){return `https://gamma-api.polymarket.com/events/slug/${s}`}function eventUrl(s){return `https://polymarket.com/zh-hant/event/${s}`}function tradesUrl(c,o=0){return `https://data-api.polymarket.com/trades?market=${c}&limit=10000&offset=${o}`}
async function loadMarkets(){const slug=document.getElementById('eventSelect').value;log('讀取 Event JSON：'+slug,true);try{const r=await fetch(gammaUrl(slug),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`Event HTTP ${r.status}`);const ev=await r.json();currentMarkets=(ev.markets||[]).filter(m=>m.active===true||Number(m.volume||0)>0);if(!currentMarkets.length)currentMarkets=ev.markets||[];renderMarkets();populateMarketSelect();log(`完成：找到 ${currentMarkets.length} 個市場。`)}catch(e){log('讀取失敗：'+e.message);log('可能是瀏覽器 CORS 限制。可按「開啟 Event JSON」。')}}
function displayName(m){return m.groupItemTitle||m.question||m.slug||m.conditionId}function renderMarkets(){const tb=document.getElementById('marketTable');tb.innerHTML='';currentMarkets.forEach(m=>{const tr=document.createElement('tr');[displayName(m),String(m.active),Number(m.volume||0).toFixed(2),m.conditionId||''].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});if(!currentMarkets.length)tb.innerHTML='<tr><td colspan="4">無市場</td></tr>'}function populateMarketSelect(){const s=document.getElementById('marketSelect');s.innerHTML='<option value="all">全部</option>';currentMarkets.forEach((m,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=displayName(m);s.appendChild(o)})}
function twTime(ts){const d=new Date(Number(ts)*1000),p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}:${o.second}`}function todayTW(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function keepDate(r){const d=r['台灣時間'].slice(0,10),m=document.getElementById('dateMode').value;if(m==='all')return true;if(m==='today')return d===todayTW();const s=document.getElementById('startDate').value,e=document.getElementById('endDate').value;if(s&&d<s)return false;if(e&&d>e)return false;return true}
async function fetchOne(region,m){let out=[],offset=0;while(true){const r=await fetch(tradesUrl(m.conditionId,offset),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`${displayName(m)} HTTP ${r.status}`);const a=await r.json();if(!Array.isArray(a))throw new Error(`${displayName(m)} 回傳格式異常`);for(const x of a){const size=Number(x.size||0),price=Number(x.price||0);out.push({'台灣時間':twTime(x.timestamp),'地區':region,'候選人／政黨':displayName(m),'買賣':x.side||'','結果':x.outcome||'','Shares':size,'成交價格':price,'成交金額_USDC':size*price,'帳號名稱':x.name||'','暱稱':x.pseudonym||'','Proxy Wallet':x.proxyWallet||'','Transaction Hash':x.transactionHash||'','Condition ID':x.conditionId||'','Asset':x.asset||'','市場標題':x.title||'','Event Slug':x.eventSlug||''})}if(a.length<10000)break;offset+=10000;if(offset>10000)break}return out}
async function fetchTrades(){if(!currentMarkets.length){await loadMarkets();if(!currentMarkets.length)return}const region=document.getElementById('eventSelect').selectedOptions[0].textContent,mv=document.getElementById('marketSelect').value,targets=mv==='all'?currentMarkets:[currentMarkets[Number(mv)]];currentRows=[];log(`開始抓取 ${region}，市場數 ${targets.length}...`,true);try{for(const m of targets){log(`抓取 ${displayName(m)}...`);const r=await fetchOne(region,m);log(`  → ${r.length} 筆`);currentRows=currentRows.concat(r)}currentRows=currentRows.filter(keepDate).sort((a,b)=>b['台灣時間'].localeCompare(a['台灣時間']));renderTrades();log(`完成。篩選後共 ${currentRows.length} 筆。`)}catch(e){log('抓取失敗：'+e.message);log('可使用「開啟所選市場原始 trades」備援。')}}
function renderTrades(){const tb=document.getElementById('tradeTable');tb.innerHTML='';currentRows.slice(0,500).forEach(r=>{const tr=document.createElement('tr');['台灣時間','地區','候選人／政黨','買賣','結果','Shares','成交價格','成交金額_USDC','帳號名稱','Proxy Wallet'].forEach(k=>{const td=document.createElement('td');td.textContent=typeof r[k]==='number'?r[k].toFixed(k==='成交價格'?6:k==='成交金額_USDC'?2:4):r[k];tr.appendChild(td)});tb.appendChild(tr)});if(!currentRows.length)tb.innerHTML='<tr><td colspan="10">沒有符合條件的資料</td></tr>';const total=currentRows.reduce((s,r)=>s+Number(r['成交金額_USDC']||0),0);document.getElementById('summary').textContent=`共 ${currentRows.length} 筆；成交金額欄位加總 ${total.toFixed(2)} USDC。預覽最多顯示前 500 筆。`}
function esc(v){v=v==null?'':String(v);return '"'+v.replaceAll('"','""')+'"'}function downloadCSV(){if(!currentRows.length){alert('請先抓取成交紀錄。');return}const h=['台灣時間','地區','候選人／政黨','買賣','結果','Shares','成交價格','成交金額_USDC','帳號名稱','暱稱','Proxy Wallet','Transaction Hash','Condition ID','Asset','市場標題','Event Slug'];let csv=h.map(esc).join(',')+'\r\n'+currentRows.map(r=>h.map(k=>esc(r[k])).join(',')).join('\r\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);const region=document.getElementById('eventSelect').selectedOptions[0].textContent,dm=document.getElementById('dateMode').selectedOptions[0].textContent.replaceAll('/','-');a.download=`${region}_Polymarket_${dm}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function openEventPage(){window.open(eventUrl(document.getElementById('eventSelect').value),'_blank')}function openGamma(){window.open(gammaUrl(document.getElementById('eventSelect').value),'_blank')}function openRawTrades(){if(!currentMarkets.length){alert('請先按「讀取候選人」。');return}const mv=document.getElementById('marketSelect').value,targets=mv==='all'?currentMarkets:[currentMarkets[Number(mv)]];targets.forEach(m=>window.open(tradesUrl(m.conditionId,0),'_blank'))}
document.getElementById('eventSelect').addEventListener('change',()=>{currentMarkets=[];currentRows=[];document.getElementById('marketSelect').innerHTML='<option value="all">全部</option>';document.getElementById('marketTable').innerHTML='<tr><td colspan="4">請按「讀取候選人」</td></tr>';document.getElementById('tradeTable').innerHTML='<tr><td colspan="10">尚未抓取</td></tr>';document.getElementById('summary').textContent='尚未抓取。'});init();
</script></body></html>
