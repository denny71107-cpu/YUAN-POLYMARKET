<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 台灣地方選舉 Polymarket 全台查詢工具</title><style>
:root{--bg:#f3f6f9;--card:#fff;--text:#172033;--muted:#657287;--blue:#155e9a;--line:#d8e0e8;--head:#edf2f7;--green:#07883b;--red:#dc2638}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,"Microsoft JhengHei",sans-serif}.wrap{max-width:1240px;margin:28px auto;padding:0 16px 50px}.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #0000000d}h1{margin:0 0 7px;font-size:27px}h2{margin:0 0 14px;font-size:19px}.sub,.note{color:var(--muted);font-size:13px}.badge{display:inline-block;background:#e8f1f8;color:#155e9a;border-radius:999px;padding:3px 9px;font-size:12px;margin-right:4px}.grid{display:grid;grid-template-columns:1.1fr 1.4fr 1fr 1.3fr;gap:12px}label{display:block;font-weight:700;margin-bottom:6px}select,input,button{width:100%;border:1px solid #cfd8e3;border-radius:8px;padding:10px 11px;font-size:14px;background:#fff}button{border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px}.secondary{background:#4b5563}.hidden{display:none!important}.advanced{margin-top:12px;border-top:1px solid #edf0f4;padding-top:10px}.advanced summary{cursor:pointer;color:#8a94a3;font-size:12px;user-select:none}.advanced-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ghost{background:#f1f3f6;color:#596475;font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:330px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}th{position:sticky;top:0;background:var(--head);z-index:2;white-space:nowrap}.market-table td{white-space:nowrap}.trade-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.trade-head h2{margin:0}.trade-filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin:8px 0 12px}.tradewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:650px}.trade{min-width:1080px}.trade td{white-space:nowrap;padding:8px 10px}.trade tbody tr:hover{background:#f7fbff}.num{text-align:right;font-variant-numeric:tabular-nums}.time{font-family:Consolas,monospace;color:#475569}.candidate{display:inline-block;background:#2f7fb9;color:white;border-radius:4px;padding:3px 7px;font-weight:800;font-size:11px;max-width:175px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.side{display:inline-block;color:#fff;border-radius:4px;padding:3px 7px;font-weight:800;font-size:11px}.buy{background:var(--green)}.sell{background:var(--red)}.linkish,.mono{color:#0563d8;text-decoration:none}.linkish:hover,.mono:hover{text-decoration:underline}.mono{font-family:Consolas,monospace}.copy{width:auto;border:0;background:transparent;color:#a6afba;padding:0 2px;font-size:12px}.copy:hover{color:#155e9a}#log{white-space:pre-wrap;background:#172033;color:#dce4ed;padding:12px;border-radius:8px;max-height:150px;overflow:auto;font:12px Consolas,monospace}.loading{color:#155e9a;font-size:12px;margin-top:6px}.fold summary{cursor:pointer;font-weight:800;font-size:18px;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary:after{content:'＋ 顯示';float:right;font-size:12px;color:var(--muted)}.fold[open] summary:after{content:'－ 隱藏'}.global-search{display:grid;grid-template-columns:1fr auto;gap:10px}.global-search button{width:auto;min-width:170px}.progress{margin-top:9px;font-size:12px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.advanced-box,.trade-filters{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.trade-head{display:block}.trade-head .note{margin-top:5px}.global-search{grid-template-columns:1fr}.global-search button{width:100%}}
</style></head><body><div class="wrap"><div class="card"><h1>2026 台灣地方選舉 Polymarket 全台查詢工具</h1><p class="sub">22 縣市 + 全國政黨市場｜選擇縣市後自動讀取候選人與市場。</p><span class="badge">台灣時間 UTC+8</span><span class="badge">自動讀取候選人</span><span class="badge">手機相容模式</span><span class="badge">CSV 匯出</span></div>
<div class="card"><h2>查詢條件</h2><div class="grid"><div><label>地區／市場</label><select id="eventSelect"></select><div id="marketLoading" class="loading"></div></div><div><label>候選人／政黨</label><select id="marketSelect"><option value="all">讀取中…</option></select></div><div><label>日期範圍</label><select id="dateMode" onchange="toggleDates()"><option value="all">全部紀錄</option><option value="today">今天</option><option value="custom">自訂日期</option></select></div><div id="dateCustomWrap" class="hidden"><label>自訂日期</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input type="date" id="startDate"><input type="date" id="endDate"></div></div></div><div class="actions"><button onclick="fetchTrades()">抓取成交紀錄</button><button class="secondary" onclick="downloadCSV()">下載 CSV</button></div><details class="advanced"><summary>進階工具 ▾</summary><div class="advanced-box"><button class="ghost" onclick="openEventPage()">開啟 Polymarket 頁面</button><button class="ghost" onclick="openGamma()">開啟 Event JSON</button><button class="ghost" onclick="openRawTrades()">開啟所選市場原始 trades</button></div></details></div>
<details class="card fold"><summary>目前市場</summary><div style="height:12px"></div><div class="tablewrap"><table class="market-table"><thead><tr><th>名稱</th><th>Active</th><th>成交量</th><th>Condition ID</th></tr></thead><tbody id="marketTable"><tr><td colspan="4">讀取中…</td></tr></tbody></table></div></details>
<details class="card fold"><summary>執行狀態</summary><div style="height:12px"></div><div id="log">準備中…</div></details>
<div class="card"><h2>全縣市帳號／錢包追查</h2><p class="sub">輸入 Polymarket 名稱、暱稱或 Proxy Wallet，掃描目前收錄的全部選舉市場，列出該帳號的所有成交紀錄。</p><div class="global-search"><input id="globalQuery" placeholder="輸入名稱、暱稱或 0x 錢包地址"><button onclick="globalSearch()">搜尋全縣市</button></div><div id="globalProgress" class="progress">尚未搜尋。</div></div>
<div class="card"><div class="trade-head"><h2>成交紀錄預覽</h2><div id="summary" class="note">尚未抓取。</div></div><div class="trade-filters"><div><label>篩選候選人／政黨</label><select id="tradeCandidateFilter" onchange="renderTrades()"><option value="all">全部</option></select></div><div><label>篩選買賣</label><select id="tradeSideFilter" onchange="renderTrades()"><option value="all">全部</option><option value="BUY">BUY</option><option value="SELL">SELL</option></select></div><div><label>篩選標的</label><select id="tradeOutcomeFilter" onchange="renderTrades()"><option value="all">全部</option><option value="Yes">Yes</option><option value="No">No</option></select></div></div><div class="tradewrap"><table class="trade"><thead><tr><th>時間 (UTC+8) ↓</th><th>地區</th><th>候選人／政黨</th><th>方向</th><th>標的</th><th class="num">Shares</th><th class="num">價格</th><th class="num">總金額</th><th>名稱</th><th>錢包</th><th>Hash</th></tr></thead><tbody id="tradeTable"><tr><td colspan="11">尚未抓取</td></tr></tbody></table></div></div></div>
<script>
const EVENTS=[["基隆市","keelung-mayor-election-winner-20260813135716100"],["台北市","taipei-mayor-election-winner-20260813125857100"],["新北市","new-taipei-mayor-election-winner-20260813125857200"],["桃園市","taoyuan-mayor-election-winner-20260813125857300"],["新竹市","hsinchu-city-mayor-election-winner-20260813135716400"],["新竹縣","hsinchu-county-magistrate-election-winner-20260813135716300"],["苗栗縣","miaoli-county-magistrate-election-winner-20260813135716500"],["台中市","taichung-mayor-election-winner-20260813125857400"],["彰化縣","changhua-county-magistrate-election-winner-20260813135716600"],["南投縣","nantou-county-magistrate-election-winner-20260813135716700"],["雲林縣","yunlin-county-magistrate-election-winner-20260813135716800"],["嘉義市","chiayi-city-mayor-election-winner-202608131357161000"],["嘉義縣","chiayi-county-magistrate-election-winner-20260813135716900"],["台南市","tainan-mayor-election-winner-20260813125857500"],["高雄市","kaohsiung-mayor-election-winner-20260813125857600"],["屏東縣","pingtung-county-magistrate-election-winner-202608131357161100"],["宜蘭縣","yilan-county-magistrate-election-winner-20260813135716200"],["花蓮縣","hualien-county-magistrate-election-winner-202608131357161200"],["台東縣","taitung-county-magistrate-election-winner-202608131357161300"],["澎湖縣","penghu-county-magistrate-election-winner-202608131357161400"],["金門縣","kinmen-county-magistrate-election-winner-202608131357161500"],["連江縣","lienchiang-county-magistrate-election-winner-202608131357161600"],["全國－政黨勝出","2026-taiwanese-local-elections-party-winner"]];let currentMarkets=[],currentRows=[],loadSeq=0;
function gammaUrl(s){return `https://gamma-api.polymarket.com/events/slug/${s}`}function eventUrl(s){return `https://polymarket.com/zh-hant/event/${s}`}function tradesUrl(c,o=0){return `https://data-api.polymarket.com/trades?market=${c}&limit=10000&offset=${o}`}function profileUrl(w){return `https://polymarket.com/zh-hant/profile/${w}`}function relayUrl(){return 'https://relay.link/transactions'}function oklinkTxUrl(h){return `https://www.oklink.com/polygon/tx/${encodeURIComponent(h)}`}function displayName(m){return m.groupItemTitle||m.question||m.slug||m.conditionId}function log(m,r=false){const e=document.getElementById('log');e.textContent=r?m:e.textContent+'\n'+m;e.scrollTop=e.scrollHeight}function toggleDates(){document.getElementById('dateCustomWrap').classList.toggle('hidden',document.getElementById('dateMode').value!=='custom')}
async function fetchJsonCompat(url){const bust=(url.includes('?')?'&':'?')+'_='+Date.now();const direct=url+bust;const routes=[direct,`https://corsproxy.io/?url=${encodeURIComponent(direct)}`,`https://api.allorigins.win/raw?url=${encodeURIComponent(direct)}`];let last;for(let i=0;i<routes.length;i++){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(routes[i],{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',headers:{Accept:'application/json'},signal:controller.signal});clearTimeout(timer);if(!r.ok)throw Error(`HTTP ${r.status}`);const text=await r.text();const data=JSON.parse(text);if(i>0)log('手機相容模式：已透過備援路徑讀取資料');return data}catch(e){clearTimeout(timer);last=e}}throw last||Error('無法連線')}
async function loadMarkets(){const seq=++loadSeq,slug=document.getElementById('eventSelect').value,s=document.getElementById('marketSelect');currentMarkets=[];s.innerHTML='<option>讀取中…</option>';s.disabled=true;document.getElementById('marketLoading').textContent='正在讀取候選人…';document.getElementById('marketTable').innerHTML='<tr><td colspan="4">讀取中…</td></tr>';try{const ev=await fetchJsonCompat(gammaUrl(slug));if(seq!==loadSeq)return;currentMarkets=(ev.markets||[]).filter(m=>m.active===true||Number(m.volume||0)>0);if(!currentMarkets.length)currentMarkets=ev.markets||[];renderMarkets();populateMarkets();document.getElementById('marketLoading').textContent=`已讀取 ${currentMarkets.length} 個市場`;log(`已自動讀取 ${document.getElementById('eventSelect').selectedOptions[0].textContent}：${currentMarkets.length} 個市場`,true)}catch(e){if(seq!==loadSeq)return;s.innerHTML='<option value="all">讀取失敗</option>';document.getElementById('marketLoading').textContent='讀取失敗，請重新整理再試';document.getElementById('marketTable').innerHTML='<tr><td colspan="4">候選人讀取失敗</td></tr>';log('候選人讀取失敗：'+(e?.message||e),true)}finally{if(seq===loadSeq)s.disabled=false}}
function populateMarkets(){const s=document.getElementById('marketSelect');s.innerHTML='<option value="all">全部</option>';currentMarkets.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=displayName(m);s.appendChild(o)})}function renderMarkets(){const tb=document.getElementById('marketTable');tb.innerHTML='';currentMarkets.forEach(m=>{const tr=document.createElement('tr');[displayName(m),String(m.active),Number(m.volume||0).toFixed(2),m.conditionId||''].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});if(!currentMarkets.length)tb.innerHTML='<tr><td colspan="4">無市場</td></tr>'}
function twTime(ts){const d=new Date(Number(ts)*1000),p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}-${o.month}-${o.day} ${o.hour}:${o.minute}:${o.second}`}function todayTW(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function keepDate(r){const d=r['台灣時間'].slice(0,10),m=document.getElementById('dateMode').value;if(m==='all')return true;if(m==='today')return d===todayTW();const s=document.getElementById('startDate').value,e=document.getElementById('endDate').value;return !(s&&d<s)&&!(e&&d>e)}
async function fetchOne(region,m){let out=[],offset=0;while(true){const a=await fetchJsonCompat(tradesUrl(m.conditionId,offset));if(!Array.isArray(a))throw Error('回傳格式異常');for(const x of a){const size=Number(x.size||0),price=Number(x.price||0);out.push({'台灣時間':twTime(x.timestamp),'地區':region,'候選人／政黨':displayName(m),'買賣':x.side||'','結果':x.outcome||'','Shares':size,'成交價格':price,'成交金額_USDC':size*price,'帳號名稱':x.name||'','暱稱':x.pseudonym||'','Proxy Wallet':x.proxyWallet||'','Transaction Hash':x.transactionHash||'','Condition ID':x.conditionId||'','Asset':x.asset||'','市場標題':x.title||'','Event Slug':x.eventSlug||''})}if(a.length<10000||offset>=10000)break;offset+=10000}return out}
function dedupeRows(rows){const seen=new Set();return rows.filter(r=>{const k=[r['Transaction Hash'],r['Asset'],r['Condition ID'],r['買賣'],r['結果'],Number(r.Shares||0),Number(r['成交價格']||0),r['Proxy Wallet']].join('|');if(seen.has(k))return false;seen.add(k);return true})}
async function globalSearch(){const q=(document.getElementById('globalQuery').value||'').trim().toLowerCase();if(!q){alert('請輸入名稱、暱稱或錢包地址');return}const p=document.getElementById('globalProgress');currentRows=[];log('開始全縣市追查…',true);let checked=0,failed=0;for(const [region,slug] of EVENTS){p.textContent=`掃描中 ${checked+1}/${EVENTS.length}：${region}`;try{const ev=await fetchJsonCompat(gammaUrl(slug)),markets=(ev.markets||[]).filter(m=>m.active===true||Number(m.volume||0)>0);for(const m of (markets.length?markets:(ev.markets||[]))){const a=await fetchOne(region,m);currentRows.push(...a.filter(r=>String(r['帳號名稱']||'').toLowerCase().includes(q)||String(r['暱稱']||'').toLowerCase().includes(q)||String(r['Proxy Wallet']||'').toLowerCase().includes(q)))}}catch(e){failed++;log(`${region} 掃描失敗：${e?.message||e}`)}checked++}const before=currentRows.length;currentRows=dedupeRows(currentRows).sort((a,b)=>b['台灣時間'].localeCompare(a['台灣時間']));populateTradeFilters();renderTrades();p.textContent=`完成：${checked} 個地區，找到 ${currentRows.length} 筆${before>currentRows.length?`，已移除 ${before-currentRows.length} 筆重複資料`:''}${failed?`，${failed} 個地區讀取失敗`:''}`;log(`全縣市追查完成，共 ${currentRows.length} 筆。`)}
async function fetchTrades(){if(!currentMarkets.length){await loadMarkets();if(!currentMarkets.length)return}const region=document.getElementById('eventSelect').selectedOptions[0].textContent,mv=document.getElementById('marketSelect').value,targets=mv==='all'?currentMarkets:[currentMarkets[Number(mv)]];currentRows=[];log(`開始抓取 ${region}…`,true);try{for(const m of targets){log(`抓取 ${displayName(m)}…`);const a=await fetchOne(region,m);log(`→ ${a.length} 筆`);currentRows.push(...a)}const rawCount=currentRows.length;currentRows=dedupeRows(currentRows.filter(keepDate)).sort((a,b)=>b['台灣時間'].localeCompare(a['台灣時間']));populateTradeFilters();renderTrades();log(`完成，共 ${currentRows.length} 筆${rawCount>currentRows.length?`（已移除 ${rawCount-currentRows.length} 筆重複資料）`:''}。`)}catch(e){log('抓取失敗：'+(e?.message||e))}}
function populateTradeFilters(){const s=document.getElementById('tradeCandidateFilter'),prev=s.value,names=[...new Set(currentRows.map(r=>r['候選人／政黨']).filter(Boolean))].sort();s.innerHTML='<option value="all">全部</option>';names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)});if(names.includes(prev))s.value=prev}
function shortHex(v){return !v?'—':v.length>15?v.slice(0,7)+'…'+v.slice(-4):v}function copyText(v,b){if(!v)return;navigator.clipboard.writeText(v).then(()=>{b.textContent='✓';setTimeout(()=>b.textContent='▣',800)})}async function openRelayWithWallet(w){if(!w)return;try{await navigator.clipboard.writeText(w);log('已複製錢包地址，請在 Relay 搜尋框貼上。')}catch(e){log('無法自動複製，請使用旁邊複製按鈕。')}window.open(relayUrl(),'_blank','noopener')}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filteredRows(){const c=document.getElementById('tradeCandidateFilter').value,s=document.getElementById('tradeSideFilter').value,o=document.getElementById('tradeOutcomeFilter').value;return currentRows.filter(r=>(c==='all'||r['候選人／政黨']===c)&&(s==='all'||r['買賣']===s)&&(o==='all'||String(r['結果']).toLowerCase()===o.toLowerCase()))}
function renderTrades(){const rows=filteredRows(),tb=document.getElementById('tradeTable');tb.innerHTML='';rows.slice(0,500).forEach(r=>{const tr=document.createElement('tr'),w=r['Proxy Wallet']||'',h=r['Transaction Hash']||'',nm=r['帳號名稱']||r['暱稱']||'—';tr.innerHTML=`<td class="time">${safe(r['台灣時間'])}</td><td>${safe(r['地區'])}</td><td><span class="candidate" title="${safe(r['候選人／政黨'])}">${safe(r['候選人／政黨'])}</span></td><td><span class="side ${r['買賣']==='BUY'?'buy':'sell'}">${safe(r['買賣'])}</span></td><td>${safe(r['結果'])}</td><td class="num">${Number(r.Shares||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td class="num">${(Number(r['成交價格']||0)*100).toFixed(1)}¢</td><td class="num"><b>$${Number(r['成交金額_USDC']||0).toLocaleString(undefined,{maximumFractionDigits:0})}</b></td><td><a class="linkish" href="${profileUrl(encodeURIComponent(w))}" target="_blank" rel="noopener">${safe(nm)}</a></td><td><a class="mono wallet-link" href="#" title="複製錢包並開啟 Relay：${safe(w)}">${safe(shortHex(w))}</a> <button class="copy" title="複製錢包">▣</button></td><td><a class="mono" href="${oklinkTxUrl(h)}" target="_blank" rel="noopener" title="在 OKLink 查看交易：${safe(h)}">${safe(shortHex(h))}</a> <button class="copy" title="複製 Hash">▣</button></td>`;const walletLink=tr.querySelector('.wallet-link');walletLink.onclick=e=>{e.preventDefault();openRelayWithWallet(w)};const bs=tr.querySelectorAll('.copy');bs[0].onclick=()=>copyText(w,bs[0]);bs[1].onclick=()=>copyText(h,bs[1]);tb.appendChild(tr)});if(!rows.length)tb.innerHTML='<tr><td colspan="11">沒有符合篩選條件的資料</td></tr>';const total=rows.reduce((s,r)=>s+Number(r['成交金額_USDC']||0),0);document.getElementById('summary').textContent=`顯示 ${rows.length} / ${currentRows.length} 筆 · 金額 ${total.toFixed(2)} USDC · 預覽最多 500 筆`}
function esc(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function downloadCSV(){const rows=filteredRows();if(!rows.length){alert('目前沒有可下載的成交紀錄');return}const h=['台灣時間','地區','候選人／政黨','買賣','結果','Shares','成交價格','成交金額_USDC','帳號名稱','暱稱','Proxy Wallet','Transaction Hash','Condition ID','Asset','市場標題','Event Slug'],csv='\ufeff'+h.map(esc).join(',')+'\r\n'+rows.map(r=>h.map(k=>esc(r[k])).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`Polymarket_成交紀錄.csv`;a.click()}function openEventPage(){window.open(eventUrl(document.getElementById('eventSelect').value),'_blank')}function openGamma(){window.open(gammaUrl(document.getElementById('eventSelect').value),'_blank')}function openRawTrades(){if(!currentMarkets.length)return;const v=document.getElementById('marketSelect').value,t=v==='all'?currentMarkets:[currentMarkets[Number(v)]];t.forEach(m=>window.open(tradesUrl(m.conditionId),'_blank'))}
function init(){const s=document.getElementById('eventSelect');EVENTS.forEach(([n,v])=>{const o=document.createElement('option');o.value=v;o.textContent=n;s.appendChild(o)});s.addEventListener('change',()=>{currentRows=[];document.getElementById('tradeTable').innerHTML='<tr><td colspan="11">尚未抓取</td></tr>';document.getElementById('summary').textContent='尚未抓取。';document.getElementById('tradeCandidateFilter').innerHTML='<option value="all">全部</option>';document.getElementById('tradeSideFilter').value='all';document.getElementById('tradeOutcomeFilter').value='all';loadMarkets()});loadMarkets()}init();
</script></body></html>
